<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimeBot Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%235865f2' d='M13 2 3 14h9l-1 8 11-12h-9l1-8z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand" data-link>
        <span class="brand-mark"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
        <span class="brand-name">PrimeBot</span>
        <span class="brand-sub">Dashboard</span>
      </a>
      <nav class="topnav">
        <a href="/" data-link>Servers</a>
        <a href="/dashboard" data-link>Overview</a>
        <a href="/live" data-link>Live</a>
        <a href="/docs" data-link>Docs</a>
        <span id="user-menu" class="user-menu hidden"></span>
      </nav>
    </div>
  </header>

  <main id="app" class="container">
    <!-- Initial loading state -->
    <div class="splash">
      <div class="spinner"></div>
      <p>Loading PrimeBot Dashboard…</p>
    </div>
  </main>

  <footer class="footer">
    <span>PrimeBot <span id="bot-version"></span> · Control panel for server admins</span>
  </footer>

  <!-- Toast notifications -->
  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
