<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimeBot Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand" data-link>
        <span class="brand-mark">⚡</span>
        <span class="brand-name">PrimeBot</span>
        <span class="brand-sub">Dashboard</span>
      </a>
      <nav class="topnav">
        <a href="/" data-link>Servers</a>
        <a href="/dashboard" data-link>Overview</a>
        <span id="user-menu" class="user-menu hidden"></span>
      </nav>
    </div>
  </header>

  <main id="app" class="container">
    <!-- Initial loading state -->
    <div class="splash">
      <div class="spinner"></div>
      <p>Loading PrimeBot Dashboard…</p>
    </div>
  </main>

  <footer class="footer">
    <span>PrimeBot <span id="bot-version"></span> · Control panel for server admins</span>
  </footer>

  <!-- Toast notifications -->
  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
