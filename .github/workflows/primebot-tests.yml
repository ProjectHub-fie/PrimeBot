# Node test runner for the /pbad/tests dashboard — PrimeBot profile.
#
# This is the executable copy of the workflow the dashboard dispatches on this
# repository (ProjectHub-fie/PrimeBot) from the ProjectHub admin console. The
# dashboard's suite-runner REPOSITORY_PROFILES registry points its `primebot`
# profile here: workflow `primebot-tests.yml`, default branch `main`, runner
# `npm test`. The same file is mirrored in the ProjectHub repo so the dashboard
# test suite can read it; GitHub Actions only runs a workflow that exists in the
# repository against which it is dispatched, which is this one.
#
# This workflow is a mirror of ProjectHub's dashboard copy — keep file name,
# input, artifact name and TAP file name in sync with
# ProjectHub-fie/ProjectHub/.github/workflows/primebot-tests.yml.
name: PrimeBot Tests

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation id generated by the /pbad/tests dashboard.
        required: false
        default: manual
        type: string

run-name: PrimeBot tests (${{ inputs.request_id || 'manual' }})

permissions:
  contents: read

concurrency:
  group: primebot-tests-${{ inputs.request_id || 'manual' }}
  cancel-in-progress: false

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # PrimeBot is a plain Node project: no Docker, no database. The lockfile
      # is authoritative when present (npm ci is reproducible and fails loudly
      # on drift); without it, npm install resolves fresh.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run npm test and capture TAP output
        # The suite runs `node --test tests/*.test.js` (the repo's own `npm
        # test` script). Stdout is teed to a file so the dashboard can read the
        # full stream from the artifact. `set -o pipefail` forwards the suite's
        # exit code past `tee`, so the job conclusion reflects the tests. There
        # is deliberately no `continue-on-error`: the dashboard reads the run
        # conclusion, so a failing suite must fail the job.
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/test-output"
          npm test 2>&1 | tee "$RUNNER_TEMP/test-output/tap-output.tap"
          echo "TAP bytes: $(wc -c < "$RUNNER_TEMP/test-output/tap-output.tap")"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primebot-tests-tap-${{ inputs.request_id || 'manual' }}
          path: ${{ runner.temp }}/test-output/tap-output.tap
          if-no-files-found: ignore

      - name: Write the step summary
        if: always()
        run: |
          TAP="$RUNNER_TEMP/test-output/tap-output.tap"
          if [ ! -s "$TAP" ]; then
            echo "### PrimeBot tests :x: completed with no output" >> "$GITHUB_STEP_SUMMARY"
            echo "See the job log and the primebot-tests-tap artifact for details." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TESTS=$(LC_ALL=C grep -aE '^(#|ℹ) tests ' "$TAP" | awk '{print $NF}' | tail -1)
          PASS=$(LC_ALL=C grep -aE '^(#|ℹ) pass ' "$TAP" | awk '{print $NF}' | tail -1)
          FAIL=$(LC_ALL=C grep -aE '^(#|ℹ) fail ' "$TAP" | awk '{print $NF}' | tail -1)
          SKIP=$(LC_ALL=C grep -aE '^(#|ℹ) skipped ' "$TAP" | awk '{print $NF}' | tail -1)
          echo "### PrimeBot tests result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$FAIL" ] && [ "$FAIL" != "0" ]; then
            echo "> :x: $FAIL failing · $PASS passed · $TESTS total ($SKIP skipped)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$TESTS" ]; then
            echo "> :white_check_mark: $PASS passed · $TESTS total ($SKIP skipped)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> :question: suite finished, but its summary could not be parsed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by request id \`${{ inputs.request_id || 'manual' }}\` on \`${{ github.ref_name }}\`." >> "$GITHUB_STEP_SUMMARY"